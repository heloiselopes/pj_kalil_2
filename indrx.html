<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de Estética - Agendamento MVP</title>
   
</head>
<body>

    <main class="card">
        <h1>Clínica Bella Vita</h1>
        <p class="subtitle">Agende sua avaliação em poucos segundos</p>

        <form class="form-control" action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="telefone">WhatsApp / Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(41) 99999-9999" required>
            </div>

            <div class="form-group">
                <label for="servico">Serviço Desejado:</label>
                <select id="servico" name="servico">
                    <option value="limpeza">Limpeza de Pele</option>
                    <option value="massagem">Massagem Relaxante</option>
                    <option value="design">Design de Sobrancelhas</option>
                </select>
            </div>

            <button class="btn bnt-sucess w-100" type="submit">Solicitar Agendamento</button>
        </form>
    </main>

    <footer>
        <p>MVP de Inovação & Empreendedorismo • Colégio Bento Munhoz</p>
    </footer>

</body>
</html>
